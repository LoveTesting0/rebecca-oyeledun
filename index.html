<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rebecca Olubunmi Oyeledun (Mummy Agba)</title>
<meta name="description" content="Service details and a place to share tributes for Rebecca Olubunmi Oyeledun (Mummy Agba).">
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/glacial-indifference-2" rel="stylesheet">

<style>
  :root {
    --bg: #f1f7fc;
    --card: #ffffff;
    --ink: #1c2433;
    --muted: #556075;
    --line: #d3e3f0;
    --accent: #14294b;        /* navy blue */
    --accent-hover: #1f3d6e;
    --sky: #87ceeb;           /* sky blue */
    --sky-soft: #e6f3fb;
    --sky-deep: #2f6f9f;      /* readable sky tone for small text on light backgrounds */
    --err: #9b2c2c;
    --serif: "EB Garamond", Garamond, "Palatino Linotype", Georgia, serif;
    --sans: "Glacial Indifference", "Century Gothic", "Avenir Next", "Trebuchet MS", sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    font-family: var(--serif);
    font-size: 1.15rem;
    line-height: 1.65;
    background:
      radial-gradient(900px 420px at 50% -80px, #dcecf8 0%, rgba(220,236,248,0) 70%),
      var(--bg);
  }

  /* ---------- header ---------- */
  header {
    position: relative;
    overflow: hidden;
    text-align: center;
    color: #fff;
    padding: 46px 16px 44px;
    background: radial-gradient(620px 340px at 50% 28%, #204276 0%, #14294b 58%, #0e2040 100%);
    border-bottom: 5px solid var(--sky);
  }
  .hd { position: relative; max-width: 680px; margin: 0 auto; }
  .spray { position: absolute; top: -34px; width: 150px; height: 150px; opacity: .55; pointer-events: none; }
  .spray.tl { left: -22px; transform: scaleY(-1); }
  .spray.tr { right: -22px; transform: scale(-1, -1); }

  .wreath { display: block; width: 210px; height: 210px; margin: 0 auto 6px; position: relative; z-index: 1; animation: fadeIn 1.4s ease both; }
  .epigraph { font-style: italic; font-size: 1.5rem; letter-spacing: .02em; color: var(--sky); margin: 0 0 12px; position: relative; z-index: 1; }
  h1 { font-weight: 400; font-size: clamp(2.1rem, 9vw, 3.3rem); line-height: 1.12; margin: 0; letter-spacing: .01em; position: relative; z-index: 1; }
  .aka { color: var(--sky); font-size: 1.45rem; font-style: italic; margin: 8px 0 0; position: relative; z-index: 1; }
  .dates { font-family: var(--sans); letter-spacing: .14em; color: #dcecf7; font-size: .95rem; margin: 6px 0 0; }
  .tagline { max-width: 460px; margin: 14px auto 0; font-style: italic; font-size: 1.2rem; color: #eaf5fc; }

  /* ---------- ornaments ---------- */
  .flourish { display: block; width: 96px; height: 23px; margin: 0 auto 6px; --fl-bloom: #5aa7d6; --fl-leaf: #8cbbe0; }
  .flourish.dark { --fl-bloom: #f3faff; --fl-leaf: #87ceeb; }
  .orn { display: flex; align-items: center; gap: 12px; max-width: 460px; margin: 0 auto; }
  .orn .flourish { flex: none; margin: 0; }
  .orn span { flex: 1; height: 1px; background: linear-gradient(90deg, rgba(135,190,225,0), #8fc0e0); }
  .orn span:last-child { transform: scaleX(-1); }
  .orn.dark { max-width: 320px; margin-top: 22px; position: relative; z-index: 1; }
  .orn.dark span { background: linear-gradient(90deg, rgba(135,206,235,0), rgba(135,206,235,.8)); }
  .ico { width: 17px; height: 17px; flex: none; }

  /* ---------- layout ---------- */
  .wrap { max-width: 680px; margin: 0 auto; padding: 8px 16px 40px; }
  section { margin-top: 28px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-top: 3px solid var(--sky);
    border-radius: 14px;
    padding: 26px 22px 28px;
    box-shadow: 0 10px 30px rgba(20, 41, 75, .07);
  }
  .card-head { text-align: center; margin-bottom: 14px; }
  h2 { font-weight: 400; font-size: 1.75rem; line-height: 1.2; margin: 0; color: var(--accent); }

  /* service details */
  .service { background: linear-gradient(180deg, var(--sky-soft), #ffffff 70%); }
  .details { margin: 0; text-align: center; }
  .details > div { padding: 14px 0; border-top: 1px solid var(--line); }
  .details > div:first-child { border-top: 0; }
  dt { font-family: var(--sans); text-transform: uppercase; letter-spacing: .22em; font-size: .74rem; color: var(--sky-deep); }
  dd { margin: 3px 0 0; font-size: 1.5rem; line-height: 1.3; color: var(--accent); }

  /* verse */
  .verse { text-align: center; margin: 38px auto 6px; padding: 0 6px; }
  blockquote { margin: 18px auto 10px; max-width: 34rem; font-style: italic; font-size: 1.35rem; line-height: 1.55; color: var(--accent); }
  .ref { font-family: var(--sans); text-transform: uppercase; letter-spacing: .22em; font-size: .75rem; color: var(--muted); margin: 0 0 18px; }

  /* form */
  .note { font-size: 1.05rem; color: var(--muted); margin: 0; text-align: center; }
  label { display: block; font-family: var(--sans); text-transform: uppercase; letter-spacing: .14em; font-size: .78rem; color: var(--accent); margin: 20px 0 7px; }
  .opt { color: var(--muted); text-transform: none; letter-spacing: .02em; font-size: .85rem; }
  input[type=text], textarea {
    width: 100%; font-family: var(--serif); font-size: 1.15rem; color: var(--ink);
    padding: 12px 14px; border: 1px solid #b9d4e8; border-radius: 10px; background: #fcfeff;
    transition: border-color .15s, box-shadow .15s;
  }
  textarea { min-height: 170px; resize: vertical; line-height: 1.55; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(135, 206, 235, .5); }
  .count { text-align: right; font-family: var(--sans); font-size: .82rem; color: var(--muted); margin-top: 5px; letter-spacing: .04em; }
  .count.over { color: var(--err); font-weight: 700; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

  button {
    margin-top: 22px; width: 100%; cursor: pointer;
    font-family: var(--sans); font-size: .95rem; text-transform: uppercase; letter-spacing: .2em;
    background: linear-gradient(180deg, #1d3b6b, var(--accent)); color: #fff;
    border: 0; border-radius: 999px; padding: 15px 18px;
    box-shadow: 0 6px 16px rgba(20, 41, 75, .25);
    transition: transform .1s, box-shadow .15s, background .15s;
  }
  button:hover { background: linear-gradient(180deg, #264b86, #1a3560); }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
  button[disabled] { opacity: .6; cursor: default; }
  .status { margin-top: 16px; min-height: 1.5em; font-size: 1.05rem; text-align: center; }
  .status.ok { color: var(--accent); }
  .status.bad { color: var(--err); }

  /* tributes */
  .tribute { background: #f6fafd; border: 1px solid var(--line); border-radius: 12px; padding: 18px 18px 14px; margin-top: 14px; }
  .tribute:first-child { margin-top: 0; }
  .tribute .text { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0 0 10px; font-size: 1.2rem; line-height: 1.65; }
  .tribute .by { display: flex; align-items: center; gap: 8px; font-family: var(--sans); text-transform: uppercase; letter-spacing: .14em; font-size: .78rem; color: var(--sky-deep); margin: 0; }
  .empty { color: var(--muted); font-style: italic; text-align: center; margin: 0; }

  /* footer */
  footer { text-align: center; padding: 8px 16px 56px; color: var(--muted); }
  footer .wreath { width: 110px; height: 110px; margin-bottom: 4px; animation: none; }
  footer p { margin: 0; font-style: italic; }

  @keyframes fadeIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .wreath { animation: none; } button { transition: none; } }
  @media (max-width: 520px) {
    .spray { width: 96px; height: 96px; top: -26px; opacity: .45; }
    .spray.tl { left: -16px; } .spray.tr { right: -16px; }
    .wreath { width: 190px; height: 190px; }
    .card { padding: 24px 16px 26px; }
    dd { font-size: 1.35rem; }
  }
</style>
</head>
<body>

<!-- Shared drawing parts: leaf, bloom, flourish, sprig -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <g id="leaf">
      <path d="M0 0 C7 -8 7 -22 0 -31 C-7 -22 -7 -8 0 0Z"/>
      <path d="M0 -2 L0 -25" stroke="#ffffff" stroke-opacity=".28" stroke-width=".9" fill="none"/>
    </g>

    <g id="bloom">
      <g>
        <ellipse cx="0" cy="-11" rx="6.5" ry="11"/>
        <ellipse cx="0" cy="-11" rx="6.5" ry="11" transform="rotate(72)"/>
        <ellipse cx="0" cy="-11" rx="6.5" ry="11" transform="rotate(144)"/>
        <ellipse cx="0" cy="-11" rx="6.5" ry="11" transform="rotate(216)"/>
        <ellipse cx="0" cy="-11" rx="6.5" ry="11" transform="rotate(288)"/>
      </g>
      <g fill="#ffffff" fill-opacity=".38" transform="rotate(36) scale(.62)">
        <ellipse cx="0" cy="-11" rx="6.5" ry="11"/>
        <ellipse cx="0" cy="-11" rx="6.5" ry="11" transform="rotate(72)"/>
        <ellipse cx="0" cy="-11" rx="6.5" ry="11" transform="rotate(144)"/>
        <ellipse cx="0" cy="-11" rx="6.5" ry="11" transform="rotate(216)"/>
        <ellipse cx="0" cy="-11" rx="6.5" ry="11" transform="rotate(288)"/>
      </g>
      <circle r="3.4" style="fill:var(--core,#ffffff)"/>
    </g>

    <g id="flourish">
      <use href="#leaf" transform="translate(46 14) rotate(-70) scale(.46)" style="fill:var(--fl-leaf,#8cbbe0)"/>
      <use href="#leaf" transform="translate(46 14) rotate(-90) scale(.52)" style="fill:var(--fl-leaf,#8cbbe0)"/>
      <use href="#leaf" transform="translate(46 14) rotate(-110) scale(.46)" style="fill:var(--fl-leaf,#8cbbe0)"/>
      <use href="#leaf" transform="translate(74 14) rotate(70) scale(.46)" style="fill:var(--fl-leaf,#8cbbe0)"/>
      <use href="#leaf" transform="translate(74 14) rotate(90) scale(.52)" style="fill:var(--fl-leaf,#8cbbe0)"/>
      <use href="#leaf" transform="translate(74 14) rotate(110) scale(.46)" style="fill:var(--fl-leaf,#8cbbe0)"/>
      <use href="#bloom" transform="translate(60 14) scale(.5)" style="fill:var(--fl-bloom,#5aa7d6);--core:#ffffff"/>
      <circle cx="20" cy="14" r="1.6" style="fill:var(--fl-leaf,#8cbbe0)"/>
      <circle cx="100" cy="14" r="1.6" style="fill:var(--fl-leaf,#8cbbe0)"/>
    </g>

    <g id="sprig">
      <path d="M8 196 C60 150 110 110 172 36" fill="none" stroke="#6aa0d0" stroke-width="2" stroke-linecap="round"/>
      <use href="#leaf" transform="translate(30 172) rotate(-20) scale(.9)" fill="#4a7fb8"/>
      <use href="#leaf" transform="translate(30 172) rotate(70) scale(.9)" fill="#6aa0d0"/>
      <use href="#leaf" transform="translate(58 148) rotate(-10) scale(.9)" fill="#6aa0d0"/>
      <use href="#leaf" transform="translate(58 148) rotate(80) scale(.9)" fill="#4a7fb8"/>
      <use href="#leaf" transform="translate(88 124) rotate(0) scale(.85)" fill="#4a7fb8"/>
      <use href="#leaf" transform="translate(88 124) rotate(90) scale(.85)" fill="#6aa0d0"/>
      <use href="#leaf" transform="translate(120 96) rotate(10) scale(.8)" fill="#6aa0d0"/>
      <use href="#leaf" transform="translate(120 96) rotate(100) scale(.8)" fill="#4a7fb8"/>
      <use href="#leaf" transform="translate(148 64) rotate(20) scale(.7)" fill="#4a7fb8"/>
      <use href="#leaf" transform="translate(148 64) rotate(110) scale(.7)" fill="#6aa0d0"/>
      <use href="#bloom" transform="translate(60 150) rotate(15) scale(.7)" fill="#87ceeb" style="--core:#ffffff"/>
      <use href="#bloom" transform="translate(112 100) rotate(40) scale(.85)" fill="#f3faff" style="--core:#87ceeb"/>
      <use href="#bloom" transform="translate(172 36) rotate(10) scale(1.2)" fill="#87ceeb" style="--core:#ffffff"/>
    </g>
  </defs>
</svg>

<header>
  <div class="hd">
    <svg class="spray tl" viewBox="0 0 200 200" aria-hidden="true"><use href="#sprig"/></svg>
    <svg class="spray tr" viewBox="0 0 200 200" aria-hidden="true"><use href="#sprig"/></svg>

    <svg id="wreath" class="wreath" viewBox="0 0 240 240" role="img" aria-label="A wreath of flowers"></svg>
    <p class="epigraph" id="epigraph"></p>
    <h1 id="name"></h1>
    <p class="aka" id="aka" hidden></p>

    <div class="orn dark" aria-hidden="true">
      <span></span>
      <svg class="flourish dark" viewBox="0 0 120 28"><use href="#flourish"/></svg>
      <span></span>
    </div>

    <p class="dates" id="dates" hidden></p>
    <p class="tagline" id="tagline" hidden></p>
  </div>
</header>

<main class="wrap">

  <section class="card service" aria-labelledby="service-h">
    <div class="card-head">
      <svg class="flourish" viewBox="0 0 120 28" aria-hidden="true"><use href="#flourish"/></svg>
      <h2 id="service-h">Funeral Service</h2>
    </div>
    <dl class="details">
      <div><dt>Date</dt><dd id="svcDate"></dd></div>
      <div><dt>Time</dt><dd id="svcTime"></dd></div>
      <div><dt>Venue</dt><dd id="svcVenue"></dd></div>
    </dl>
  </section>

  <section class="verse" id="verseBox" aria-label="A comforting scripture" hidden>
    <div class="orn" aria-hidden="true">
      <span></span>
      <svg class="flourish" viewBox="0 0 120 28"><use href="#flourish"/></svg>
      <span></span>
    </div>
    <blockquote id="verse"></blockquote>
    <p class="ref" id="verseRef"></p>
  </section>

  <section class="card" aria-labelledby="share-h">
    <div class="card-head">
      <svg class="flourish" viewBox="0 0 120 28" aria-hidden="true"><use href="#flourish"/></svg>
      <h2 id="share-h">Share a tribute</h2>
    </div>
    <p class="note">Your words will be read by the family. Tributes appear below after they have been reviewed.</p>
    <form id="form" novalidate>
      <label for="t-name">Your name</label>
      <input id="t-name" name="name" type="text" maxlength="80" autocomplete="name" required>

      <label for="t-rel">Your relationship to her <span class="opt">(optional)</span></label>
      <input id="t-rel" name="relationship" type="text" maxlength="80" placeholder="e.g. Friend, Neighbour, Cousin">

      <label for="t-text">Your tribute</label>
      <textarea id="t-text" name="tribute" maxlength="2000" required></textarea>
      <div class="count" id="countwrap"><span id="count">0</span> / 200 words</div>

      <div class="hp" aria-hidden="true">
        <label for="t-web">Leave this field empty</label>
        <input id="t-web" name="website" type="text" tabindex="-1" autocomplete="off">
      </div>

      <button type="submit" id="send">Send tribute</button>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </form>
  </section>

  <section class="card" aria-labelledby="wall-h">
    <div class="card-head">
      <svg class="flourish" viewBox="0 0 120 28" aria-hidden="true"><use href="#flourish"/></svg>
      <h2 id="wall-h">Tributes</h2>
    </div>
    <div id="wall"><p class="empty">Loading tributes...</p></div>
  </section>
</main>

<footer>
  <svg id="wreath2" class="wreath" viewBox="0 0 240 240" aria-hidden="true"></svg>
  <p>With love and gratitude from the family.</p>
</footer>

<script>
(function () {
  // ---------- EDIT THESE ----------
  var CONFIG = {
    epigraph: "Until my Relief Comes",   // shown in quotation marks above her name
    name: "Rebecca Olubunmi Oyeledun",
    aka: "(Mummy Agba)",
    dates: "",      // optional, e.g. "1950 - 2026". Leave "" to hide.
    tagline: "Loved, cherished, and forever remembered.",   // "" to hide
    serviceDate: "Thursday, 19 November 2026",
    serviceTime: "11:00 am",
    venue: "Kingdom Hall of Jehovah's Witnesses, Ilisan-Remo, Ogun State",
    // Optional scripture line. Hidden while empty. To show one, paste the wording from
    // your own New World Translation between the quotes, e.g. verse: "...", verseRef: "Revelation 21:4"
    verse: "",
    verseRef: "",
    endpoint: "https://script.google.com/macros/s/AKfycbxI3PY07cJGQPBVm1ZeLyJGMI6ZdZpd-JR6LBUcRF5CNu385Pl4Sc2HkCV51jdmpnJWEQ/exec"    // Google Apps Script web app URL
  };
  // --------------------------------

  var $ = function (id) { return document.getElementById(id); };
  var NS = "http://www.w3.org/2000/svg";
  var loadedAt = Date.now();

  // ----- drawing helpers -----
  function el(name, attrs, parent) {
    var n = document.createElementNS(NS, name);
    for (var k in attrs) { if (attrs.hasOwnProperty(k)) n.setAttribute(k, attrs[k]); }
    if (parent) parent.appendChild(n);
    return n;
  }
  function put(parent, id, x, y, rot, scale, fill, core) {
    var u = el("use", {
      href: "#" + id,
      fill: fill,
      transform: "translate(" + x.toFixed(2) + " " + y.toFixed(2) + ") rotate(" + rot.toFixed(1) + ") scale(" + scale + ")"
    }, parent);
    if (core) u.setAttribute("style", "--core:" + core);
    return u;
  }

  function buildWreath(svg, theme, monogram) {
    var cx = 120, cy = 120, r = 84, i, a, rad, x, y;
    var dark = theme === "dark";
    var leafTones = dark ? ["#2f5f97", "#4a7fb8", "#6aa0d0"] : ["#8fbbdd", "#5b93c4", "#2f5f97"];
    var petalA = dark ? "#f3faff" : "#14294b";
    var petalB = "#87ceeb";
    var coreA = dark ? "#87ceeb" : "#87ceeb";
    var coreB = "#ffffff";

    el("circle", { cx: cx, cy: cy, r: r, fill: "none", stroke: leafTones[2], "stroke-opacity": ".5", "stroke-width": "1.2" }, svg);

    for (i = 0; i < 36; i++) {
      a = i * 10;
      rad = a * Math.PI / 180;
      x = cx + r * Math.cos(rad);
      y = cy + r * Math.sin(rad);
      var s = 0.62 + 0.12 * (i % 3);
      put(svg, "leaf", x, y, a + 180 - 38, s, leafTones[i % 3]);
      put(svg, "leaf", x, y, a + 180 + 38, s * 0.92, leafTones[(i + 1) % 3]);
    }

    // angle, radius offset, scale, light or sky
    var blooms = [
      [90, 4, 0.95, 0], [64, -2, 0.62, 1], [116, -2, 0.62, 1],
      [38, 2, 0.72, 0], [142, 2, 0.72, 0], [14, -1, 0.55, 1], [166, -1, 0.55, 1],
      [-14, 2, 0.64, 0], [194, 2, 0.64, 0], [-40, 0, 0.52, 1], [220, 0, 0.52, 1],
      [-65, 3, 0.72, 0], [245, 3, 0.72, 0], [270, 0, 0.82, 1]
    ];
    blooms.forEach(function (b, idx) {
      rad = b[0] * Math.PI / 180;
      x = cx + (r + b[1]) * Math.cos(rad);
      y = cy + (r + b[1]) * Math.sin(rad);
      var light = b[3] === 0;
      put(svg, "bloom", x, y, idx * 23, b[2], light ? petalA : petalB, light ? coreA : coreB);
    });

    if (monogram) {
      el("circle", { cx: cx, cy: cy, r: 56, fill: "rgba(255,255,255,.05)", stroke: "#87ceeb", "stroke-opacity": ".35", "stroke-width": ".8" }, svg);
      var t = el("text", {
        x: cx, y: cy + 22, "text-anchor": "middle", "font-size": "68", "font-style": "italic",
        fill: "#ffffff", "font-family": "'EB Garamond', Garamond, Georgia, serif"
      }, svg);
      t.textContent = monogram;
    } else {
      put(svg, "bloom", cx, cy, 10, 1.5, "#87ceeb", "#ffffff");
    }
  }

  function icon(fill) {
    var s = document.createElementNS(NS, "svg");
    s.setAttribute("viewBox", "-24 -24 48 48");
    s.setAttribute("class", "ico");
    s.setAttribute("aria-hidden", "true");
    put(s, "bloom", 0, 0, 0, 1, fill, "#ffffff");
    return s;
  }

  buildWreath($("wreath"), "dark", CONFIG.name.charAt(0));
  buildWreath($("wreath2"), "light", "");

  // ----- fill in the page -----
  if (CONFIG.epigraph) { $("epigraph").textContent = "“" + CONFIG.epigraph + "”"; } else { $("epigraph").hidden = true; }
  $("name").textContent = CONFIG.name;
  if (CONFIG.aka) { $("aka").textContent = CONFIG.aka; $("aka").hidden = false; }
  if (CONFIG.dates) { $("dates").textContent = CONFIG.dates; $("dates").hidden = false; }
  if (CONFIG.tagline) { $("tagline").textContent = CONFIG.tagline; $("tagline").hidden = false; }
  $("svcDate").textContent = CONFIG.serviceDate;
  $("svcTime").textContent = CONFIG.serviceTime;
  $("svcVenue").textContent = CONFIG.venue;
  if (CONFIG.verse) {
    $("verse").textContent = CONFIG.verse;
    $("verseRef").textContent = CONFIG.verseRef || "";
    $("verseBox").hidden = false;
  }

  // ----- word counter (limit: 200 words) -----
  var MAX_WORDS = 200;
  function countWords(s) {
    var t = s.trim();
    return t ? t.split(/\s+/).length : 0;
  }
  var ta = $("t-text");
  function updateCount() {
    var n = countWords(ta.value);
    $("count").textContent = n;
    $("countwrap").className = "count" + (n > MAX_WORDS ? " over" : "");
  }
  ta.addEventListener("input", updateCount);

  // ----- wall -----
  function renderWall(list) {
    var wall = $("wall");
    wall.textContent = "";
    if (!list.length) {
      var p = document.createElement("p");
      p.className = "empty";
      p.textContent = "Tributes will appear here once they have been reviewed.";
      wall.appendChild(p);
      return;
    }
    list.forEach(function (t) {
      var box = document.createElement("div");
      box.className = "tribute";
      var text = document.createElement("p");
      text.className = "text";
      text.textContent = t.tribute;           // textContent: no HTML injection possible
      var by = document.createElement("p");
      by.className = "by";
      by.appendChild(icon("#5aa7d6"));
      var who = document.createElement("span");
      who.textContent = t.name + (t.relationship ? ", " + t.relationship : "");
      by.appendChild(who);
      box.appendChild(text);
      box.appendChild(by);
      wall.appendChild(box);
    });
  }

  function loadWall() {
    if (!CONFIG.endpoint) { renderWall([]); return; }
    fetch(CONFIG.endpoint)
      .then(function (r) { return r.json(); })
      .then(function (d) { renderWall(d && d.tributes ? d.tributes : []); })
      .catch(function () {
        $("wall").textContent = "";
        var p = document.createElement("p");
        p.className = "empty";
        p.textContent = "Tributes could not be loaded right now. Please refresh in a moment.";
        $("wall").appendChild(p);
      });
  }

  // ----- submit -----
  function setStatus(msg, cls) {
    var s = $("status");
    s.textContent = msg;
    s.className = "status" + (cls ? " " + cls : "");
  }

  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var f = e.target;

    if (f.website.value) return; // bot
    var name = f.name.value.trim();
    var tribute = f.tribute.value.trim();
    if (!name || !tribute) { setStatus("Please add your name and your tribute.", "bad"); return; }
    var words = countWords(tribute);
    if (words > MAX_WORDS) {
      setStatus("Your tribute is " + words + " words. Please shorten it to " + MAX_WORDS + " words or fewer.", "bad");
      return;
    }
    if (!CONFIG.endpoint) { setStatus("The form is not connected yet.", "bad"); return; }
    if (Date.now() - loadedAt < 4000) { setStatus("Please take a moment to finish your message.", "bad"); return; }

    try {
      var last = Number(localStorage.getItem("tribute_last") || 0);
      if (Date.now() - last < 30000) { setStatus("Please wait a few seconds before sending another.", "bad"); return; }
    } catch (err) {}

    var btn = $("send");
    btn.disabled = true;
    setStatus("Sending...", "");

    fetch(CONFIG.endpoint, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        name: name,
        relationship: f.relationship.value.trim(),
        tribute: tribute,
        website: f.website.value
      })
    }).then(function () {
      try { localStorage.setItem("tribute_last", String(Date.now())); } catch (err) {}
      f.reset();
      updateCount();
      setStatus("Thank you. Your tribute has been received and will appear once the family has reviewed it.", "ok");
      btn.disabled = false;
    }).catch(function () {
      setStatus("Your tribute could not be sent. Please check your connection and try again. Your text is still here.", "bad");
      btn.disabled = false;
    });
  });

  loadWall();
})();
</script>
</body>
</html>
